<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Charis Christian Center Console — church management system">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CCC Console">
    <meta name="application-name" content="CCC Console">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <title>CCC Console | Charis Christian Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                50: '#fbf7ed',
                100: '#f4e9cf',
                200: '#ead29d',
                300: '#ddb463',
                400: '#d1983c',
                500: '#c59235',
                600: '#a37129',
                700: '#815423',
                800: '#6a4521',
                900: '#5a3b1f',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: 'DM Sans', sans-serif; background-color: #050505; overflow-x: hidden; }
        #root { min-height: 100dvh; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c59235; border-radius: 10px; }
        /* Keep wide tables usable on phones without breaking the page */
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-scroll table { min-width: 560px; }
        /* Safer modal padding on short screens */
        .modal-sheet { max-height: min(90dvh, 900px); overflow-y: auto; }
        @media (max-width: 640px) {
          .page-actions { width: 100%; }
          .page-actions > button { flex: 1 1 auto; justify-content: center; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
